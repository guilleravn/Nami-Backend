name: CI

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nami
          POSTGRES_PASSWORD: nami
          POSTGRES_DB: nami
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U nami -d nami"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Before npm ci: the postinstall hook (prisma generate) needs DATABASE_URL.
      - run: cp .env.example .env
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
